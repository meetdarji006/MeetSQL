services:
  postgres:
    image: postgres:16-alpine
    container_name: meetsql-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: meetsql
      POSTGRES_PASSWORD: meetsql
      POSTGRES_DB: meetsql
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - meetsql-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetsql"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: meetsql-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: OraclePass123
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./scripts/oracle-init:/container-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    networks:
      - meetsql-net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetsql-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://meetsql:meetsql@postgres:5432/meetsql
      - ORACLE_HOST=oracle
      - ORACLE_PORT=1521
      - ORACLE_SERVICE=XEPDB1
      - ORACLE_ADMIN_USER=SYSTEM
      - ORACLE_ADMIN_PASSWORD=OraclePass123
      - JWT_ACCESS_SECRET=dev-access-secret-please-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-please-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meetsql-net

volumes:
  pg_data:
  oracle_data:

networks:
  meetsql-net:
    driver: bridge
